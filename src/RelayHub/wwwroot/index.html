<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webhook Relay Hub</title>
  <style>
    :root {
      --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
      --good: #1f7a4d; --warn: #a86400; --bad: #b3261e; --accent: #2f5fd0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9b9a94; --line: #33332f;
        --good: #5cc28f; --warn: #e0a447; --bad: #ef7b72; --accent: #7a9cf0;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
    h1 { font-size: 20px; margin: 0; }
    .muted { color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 20px 0; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
             border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    .message { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .message-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
    .message-head strong { font-size: 15px; }
    code { font-size: 12px; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 500; color: var(--muted); font-size: 12px; }
    .Delivered { color: var(--good); } .Pending { color: var(--warn); } .DeadLettered { color: var(--bad); }
    details summary { cursor: pointer; color: var(--muted); margin-top: 8px; }
    pre { background: var(--bg); padding: 10px; border-radius: 6px; overflow: auto; max-height: 260px; font-size: 12px; }
    .empty { text-align: center; padding: 40px 0; }
    @media (max-width: 600px) { .hide-sm { display: none; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Webhook Relay Hub</h1>
    <span class="muted" id="updated">Loading…</span>
  </header>

  <section class="stats" aria-label="Delivery totals">
    <div class="stat"><span class="muted">Delivered</span><b class="Delivered" id="stat-Delivered">0</b></div>
    <div class="stat"><span class="muted">Retrying</span><b class="Pending" id="stat-Pending">0</b></div>
    <div class="stat"><span class="muted">Dead letters</span><b class="DeadLettered" id="stat-DeadLettered">0</b></div>
  </section>

  <div class="filters" role="group" aria-label="Filter by status">
    <button data-status="" aria-pressed="true">All</button>
    <button data-status="Pending" aria-pressed="false">Retrying</button>
    <button data-status="DeadLettered" aria-pressed="false">Dead letters</button>
    <button data-status="Delivered" aria-pressed="false">Delivered</button>
  </div>

  <section id="messages" aria-live="polite"></section>
</main>

<script>
  let filter = "";
  const labels = { Pending: "Retrying", Delivered: "Delivered", DeadLettered: "Dead letter" };

  // Build elements with textContent so a webhook payload can never inject HTML into this page.
  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children.filter(c => c != null));
    return node;
  }
  const time = iso => iso ? new Date(iso.endsWith("Z") ? iso : iso + "Z").toLocaleTimeString() : "";

  function pretty(payload) {
    try { return JSON.stringify(JSON.parse(payload), null, 2); } catch { return payload; }
  }

  async function replay(id) {
    await fetch(`/api/deliveries/${id}/replay`, { method: "POST" });
    refresh();
  }

  function renderMessage(m) {
    const rows = m.deliveries.map(d => el("tr", {},
      el("td", {}, d.targetName),
      el("td", { className: d.status }, labels[d.status] ?? d.status),
      el("td", {}, String(d.attempts)),
      el("td", { className: "hide-sm muted" },
        d.status === "Delivered" ? `at ${time(d.deliveredAtUtc)}`
          : d.status === "Pending" && d.attempts > 0 ? `next try ${time(d.nextAttemptAtUtc)}` : ""),
      el("td", { className: "hide-sm muted" }, d.lastError ?? ""),
      el("td", {}, el("button", { onclick: () => replay(d.id), textContent: "Replay" }))
    ));

    return el("article", { className: "message" },
      el("div", { className: "message-head" },
        el("strong", {}, m.source),
        m.eventType ? el("span", {}, m.eventType) : null,
        el("span", { className: "muted" }, time(m.receivedAtUtc)),
        el("code", { className: "muted" }, m.deliveryId)),
      m.deliveries.length
        ? el("table", {},
            el("thead", {}, el("tr", {},
              ...["Target", "Status", "Attempts", "", "Last error", ""].map((h, i) =>
                el("th", { className: i === 3 || i === 4 ? "hide-sm" : "" }, h)))),
            el("tbody", {}, ...rows))
        : el("p", { className: "muted" }, "No targets subscribed to this source."),
      el("details", {}, el("summary", {}, "Payload"), el("pre", {}, pretty(m.payload))));
  }

  async function refresh() {
    try {
      const [stats, messages] = await Promise.all([
        fetch("/api/stats").then(r => r.json()),
        fetch(`/api/messages?status=${filter}`).then(r => r.json()),
      ]);
      for (const key of ["Delivered", "Pending", "DeadLettered"])
        document.getElementById(`stat-${key}`).textContent = stats[key] ?? 0;

      const list = document.getElementById("messages");
      list.replaceChildren(...(messages.length
        ? messages.map(renderMessage)
        : [el("p", { className: "muted empty" }, "No messages yet. Run scripts/send-test-webhook.ps1 to send one.")]));
      document.getElementById("updated").textContent = `Updated ${new Date().toLocaleTimeString()}`;
    } catch {
      document.getElementById("updated").textContent = "Can't reach the hub. Is it running?";
    }
  }

  document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.status;
    document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
    refresh();
  }));

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
